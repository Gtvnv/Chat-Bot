name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o fluxo só precisa ler o código.
permissions:
  contents: read

# Cancela execuções antigas da mesma referência quando chega um novo envio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Instalar dependências de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar o pacote
        run: pip install -e .

      # Qualquer teste com falha encerra o passo com código diferente de zero
      # e marca a execução como reprovada.
      - name: Executar os testes
        run: pytest
